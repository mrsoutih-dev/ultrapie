# Ultrapie & VibeHeberg Production Docker Compose Stack
# Run: docker compose -f infrastructure/docker-compose.prod.yml up -d

services:
  # 1. Edge Reverse Proxy & Automated Wildcard TLS (Caddy v2)
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: ultrapie-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - ultrapie-network

  # 2. Ultrapie Next.js App & Edge Runner
  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: ultrapie-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ultrapie_secret_pass}@postgres:5432/${POSTGRES_DB:-ultrapie_prod}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:-ultrapie_redis_pass}@redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET:-ultrapie-prod-session-super-secret-key-32b}
      - COOLIFY_URL=${COOLIFY_URL:-http://coolify:8000}
      - COOLIFY_API_KEY=${COOLIFY_API_KEY}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/backups?action=health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ultrapie-network

  # 3. Production Managed PostgreSQL 16 Cluster
  postgres:
    image: postgres:16-alpine
    container_name: ultrapie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultrapie_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ultrapie_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ultrapie_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ultrapie-network

  # 4. Global Edge Redis 7 Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: ultrapie-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ultrapie_redis_pass} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ultrapie_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ultrapie-network

  # 5. Dedicated Coolify Self-Hosted VPS Engine
  coolify:
    image: ghcr.io/coollabsio/coolify:latest
    container_name: ultrapie-coolify
    restart: unless-stopped
    environment:
      - APP_PORT=8000
    volumes:
      - coolify_data:/data/coolify
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ultrapie-network

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  coolify_data:

networks:
  ultrapie-network:
    driver: bridge
